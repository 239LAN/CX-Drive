{% extends "base.html" %}
{% block title %}回收站 - 创想云盘{% endblock %}
{% block content %}
<h4 class="mb-3">
    <i class="bi bi-trash"></i> 回收站
    <form method="post" action="{{ url_for('files.empty_trash') }}" class="d-inline ms-2"
          onsubmit="return confirm('将清空回收站内全部文件，且不可恢复。确定？')">
        <button class="btn btn-outline-danger btn-sm" {% if not items %}disabled{% endif %}>
            <i class="bi bi-trash3"></i> 清空回收站
        </button>
    </form>
</h4>
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light"><tr><th>名称</th><th>大小</th><th>删除时间</th><th style="width:160px">操作</th></tr></thead>
            <tbody>
                {% for f in items %}
                <tr>
                    <td><i class="bi {{ 'bi-folder-fill text-warning' if f.is_dir else 'bi-file-earmark text-secondary' }} me-2"></i>{{ f.name }}</td>
                    <td>{{ '-' if f.is_dir else f.size|human_size }}</td>
                    <td>{{ f.deleted_at.strftime('%Y-%m-%d %H:%M') }}</td>
                    <td>
                        <form method="post" action="{{ url_for('files.restore', file_id=f.id) }}" class="d-inline">
                            <button class="btn btn-sm btn-outline-success"><i class="bi bi-arrow-counterclockwise"></i> 恢复</button>
                        </form>
                        <form method="post" action="{{ url_for('files.purge', file_id=f.id) }}" class="d-inline" onsubmit="return confirm('彻底删除后不可恢复，确定？')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-x-circle"></i> 彻底删除</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center text-muted py-5">回收站为空</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
