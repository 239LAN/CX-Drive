{% extends "base.html" %}
{% block title %}注册 - 创想云盘{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card mt-5">
            <div class="card-body p-4">
                <h4 class="text-center mb-4"><i class="bi bi-cloud-fill text-primary"></i> 注册账号</h4>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" name="username" value="{{ username or '' }}" required minlength="3">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">邮箱（可选）</label>
                        <input type="email" class="form-control" name="email" value="{{ email or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" name="password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认密码</label>
                        <input type="password" class="form-control" name="confirm" required minlength="6">
                    </div>
                    <button class="btn btn-primary w-100">注册</button>
                </form>
                <p class="text-center mt-3 mb-0">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
