{% extends "base.html" %}
{% block title %}下载 - {{ f.name }} - 创想云盘{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5 text-center">
            <div class="card-body p-4">
                <div class="display-6 mb-2">
                    <i class="bi bi-file-earmark text-secondary"></i>
                </div>
                <h5 class="text-break">{{ f.name }}</h5>
                <p class="text-muted">
                    {{ f.size|human_size }}
                    {% if link.password_hash %}<span class="badge bg-warning text-dark ms-1">密码保护</span>{% endif %}
                    {% if link.max_downloads %}<span class="badge bg-info ms-1">{{ link.download_count }}/{{ link.max_downloads }} 次下载</span>{% endif %}
                </p>
                <form method="post" action="{{ url_for('share.download', token=link.token) }}">
                    <button class="btn btn-primary btn-lg px-5">
                        <i class="bi bi-download"></i> 下载文件
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
